<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Pimple TV Channels</title>
  <style>
    body {
      background: #141414;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h2 {
      margin-top: 10px;
      margin-bottom: 15px;
      font-size: 24px;
      color: #ececec;
      text-align: center;
    }
    .container {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      width: 100%;
      padding: 15px 20px;
      font-size: 20px;
      font-weight: 600;
      color: #f1f1f1;
      background: #23272e;
      border: 2px solid #3b4048;
      border-radius: 10px;
      cursor: pointer;
      outline: none;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .btn:hover, .btn:focus {
      background: #00c853;
      color: #000000;
      border-color: #ffffff;
    }
    .tag {
      font-family: monospace;
      font-size: 18px;
      background: #111418;
      padding: 4px 10px;
      border-radius: 6px;
      color: #4da3ff;
      border: 1px solid #2d3748;
    }
    .btn:hover .tag, .btn:focus .tag {
      background: #000000;
      color: #00e676;
    }
    /* Видимое поле, из которого Android системно забирает текст */
    #clipBox {
      width: 100%;
      max-width: 720px;
      margin-top: 15px;
      padding: 12px;
      font-family: monospace;
      font-size: 16px;
      background: #1c1f24;
      color: #00e676;
      border: 2px solid #00c853;
      border-radius: 8px;
      text-align: center;
      box-sizing: border-box;
      outline: none;
    }
    #status {
      margin-top: 12px;
      font-size: 20px;
      font-weight: bold;
      color: #00e676;
      min-height: 28px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h2>Выберите канал для копирования</h2>

  <div class="container">
    <button type="button" class="btn" onclick="copyId('e38b33c56332de27ff25df223cdf488b1ec6051f', 'Pimple TV 1 (Основной)')">
      <span>★ Pimple TV 1 (Основной)</span>
      <span class="tag">...6051f</span>
    </button>

    <button type="button" class="btn" onclick="copyId('016d48fb89bb9505ab3f883db1bfb3a7c0a3eccc', 'Pimple TV 2 (Ходовой)')">
      <span>★ Pimple TV 2 (Ходовой)</span>
      <span class="tag">...3eccc</span>
    </button>

    <button type="button" class="btn" onclick="copyId('8442b5c7c99e5af57c2c40c1e28153072968988a', 'Pimple TV 3 (Ходовой)')">
      <span>★ Pimple TV 3 (Ходовой)</span>
      <span class="tag">...9888a</span>
    </button>

    <button type="button" class="btn" onclick="copyId('350b2044f1c9e87e18d8fbda1bcc456c22cf9296', 'Pimple TV 4')">
      <span>Pimple TV 4</span>
      <span class="tag">...f9296</span>
    </button>

    <button type="button" class="btn" onclick="copyId('aca05dc506242324c1727525d0535ceda24f8dea', 'Pimple TV 5')">
      <span>Pimple TV 5</span>
      <span class="tag">...f8dea</span>
    </button>

    <button type="button" class="btn" onclick="copyId('bc99becb2a74f8f455d6dbaa3bd85c6c7e938a6c', 'Pimple TV 6')">
      <span>Pimple TV 6</span>
      <span class="tag">...38a6c</span>
    </button>

    <button type="button" class="btn" onclick="copyId('12ea555d431dbe51fc8e4ca745aec09fe22a4865', 'DAZN 2 Bar DE (Резерв)')">
      <span>DAZN 2 Bar DE (Резерв мультикасту)</span>
      <span class="tag">...a4865</span>
    </button>
  </div>

  <input type="text" id="clipBox" value="Нажмите на канал выше" readonly>
  <div id="status"></div>

  <script>
    function copyId(hash, name) {
      var box = document.getElementById('clipBox');
      var status = document.getElementById('status');
      
      box.value = hash;
      box.focus();
      box.select();
      box.setSelectionRange(0, 9999);

      var copied = false;
      try {
        copied = document.execCommand('copy');
      } catch (err) {
        copied = false;
      }

      if (!copied && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(hash).then(function() {
          status.innerText = '✓ Скопировано: ' + name;
        });
      } else if (copied) {
        status.innerText = '✓ Скопировано: ' + name;
      } else {
        status.innerText = '✓ Текст выделен (нажмите Копировать)';
      }

      setTimeout(function() {
        status.innerText = '';
      }, 4000);
    }
  </script>
</body>
</html>
